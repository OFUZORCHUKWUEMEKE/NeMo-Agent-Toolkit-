# Docs Q&A agent. Run from the repo root:
#   nat run --config_file docs_qa_agent/configs/config.yml --input "your question"

functions:
  search_docs:
    _type: search_docs
    docs_dir: docs_qa_agent/sample_docs
    chunk_chars: 800
    top_k: 3

llms:
  agent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 0.0
    max_tokens: 1024

workflow:
  _type: react_agent
  llm_name: agent_llm
  tool_names: [search_docs]
  verbose: true
  parse_agent_response_max_retries: 3
  system_prompt: |
    You answer questions using only the documentation returned by search_docs.
    Cite the source file name for every claim. If the docs do not answer the question, say so.

    You have access to these tools:
    {tools}

    Tool names: {tool_names}
