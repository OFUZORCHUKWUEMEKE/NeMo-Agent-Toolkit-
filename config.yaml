# NeMo Agent Toolkit - Global Configuration
# This is the main configuration file for the entire learning project

project:
  name: "NeMo Agent Toolkit Learning Path"
  version: "0.1.0"
  description: "Progressive learning journey through AI agents"
  author: "NeMo Learner"
  created: "2024-10-13"

# Global logging configuration (inherited by all projects)
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    directory: "logs"
    max_bytes: 10485760  # 10MB
    backup_count: 5

# Default agent configuration (can be overridden per-project)
agent_defaults:
  model_name: "gpt-4"
  temperature: 0.7
  max_tokens: 2048
  timeout: 30
  enable_history: true
  max_history_messages: 100

# LLM API Configuration
llm:
  # Which provider to use (openai, anthropic, local, mock)
  provider: "mock"  # Use 'mock' for learning without API keys

  # OpenAI Configuration
  openai:
    api_key: "${OPENAI_API_KEY}"  # Load from environment variable
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2048

  # Anthropic Configuration (Claude)
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    temperature: 0.7
    max_tokens: 2048

  # Local LLM (Ollama, LM Studio, etc.)
  local:
    base_url: "http://localhost:11434"
    model: "mistral"
    temperature: 0.7

  # Mock Configuration (for testing/learning)
  mock:
    enabled: true
    latency_ms: 100  # Simulate network delay
    use_echo_responses: true

# Tool configuration (expanded in Level 2)
tools:
  enabled: false
  registry: "tools/registry.yaml"
  timeout: 30
  max_parallel_calls: 5

# Database configuration (for future levels with persistence)
database:
  type: "sqlite"  # sqlite, postgres, mongodb
  sqlite:
    path: "data/agent.db"
  postgres:
    host: "localhost"
    port: 5432
    database: "nemo_agents"
  mongodb:
    uri: "${MONGODB_URI}"

# Environment-specific settings
environments:
  development:
    logging_level: "DEBUG"
    agent_defaults:
      temperature: 0.5
    llm:
      provider: "mock"

  production:
    logging_level: "INFO"
    agent_defaults:
      temperature: 0.7
    llm:
      provider: "anthropic"

# Project structure and levels
levels:
  level_1:
    name: "Foundations"
    directory: "level_1_foundations"
    enabled: true
    projects:
      - name: "Hello Agent"
        file: "projects/01_hello_agent.py"
        difficulty: "Beginner"
        duration_hours: 2
      - name: "Echo Plus Agent"
        file: "projects/02_echo_plus_agent.py"
        difficulty: "Beginner"
        duration_hours: 2

  level_2:
    name: "Tools & Functions"
    directory: "level_2_tools"
    enabled: false
    projects: []

  level_3:
    name: "Advanced Behavior"
    directory: "level_3_advanced"
    enabled: false
    projects: []

  level_4:
    name: "Multi-Agent Systems"
    directory: "level_4_multi_agent"
    enabled: false
    projects: []

  level_5:
    name: "Production Patterns"
    directory: "level_5_production"
    enabled: false
    projects: []

  level_6:
    name: "Expert Applications"
    directory: "level_6_expert"
    enabled: false
    projects: []
